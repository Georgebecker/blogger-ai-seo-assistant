<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Blogger AI SEO Assistant</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; color: #111827; background: #ffffff; }
    header { padding: 12px 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
    header h1 { margin: 0; font-size: 14px; }
    header p { margin: 2px 0 0; font-size: 11px; opacity: .85; }
    section { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; color: #374151; }
    input { width: 100%; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid #c7d2fe; border-color: #818cf8; }
    .linha { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button { font: inherit; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-weight: 600; color: #111827; }
    button:hover { background: #f3f4f6; }
    button.principal { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    button.principal:hover { background: #4338ca; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { min-height: 16px; margin: 8px 0 0; font-size: 12px; color: #374151; }
    .msg.ok { color: #166534; }
    .msg.erro { color: #991b1b; }
    .msg.aviso { color: #92400e; }
    .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .dica { font-size: 11px; color: #6b7280; margin: 6px 0 0; }
    footer { padding: 10px 14px; font-size: 11.5px; }
    footer a { color: #4f46e5; }
  </style>
</head>
<body>
  <header>
    <h1>Blogger AI SEO Assistant</h1>
    <p>Chave Gemini, modelo e permissões</p>
  </header>

  <section>
    <div class="status"><span>Estado da chave</span><b id="status">verificando...</b></div>

    <label for="apiKey">Chave da API Gemini</label>
    <div class="linha" style="margin-top:0">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza...">
      <button id="toggleKey" type="button">Mostrar</button>
    </div>

    <label for="masterPassword">Senha mestra (criada por você; não sai do seu computador)</label>
    <input id="masterPassword" type="password" autocomplete="new-password" placeholder="mínimo de 8 caracteres">

    <div class="linha">
      <button id="saveKey" class="principal" type="button">Salvar chave</button>
      <button id="unlock" type="button">Desbloquear</button>
      <button id="lock" type="button">Bloquear</button>
    </div>
    <div class="linha">
      <button id="testKey" type="button">Testar conexão</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>

  <section>
    <label for="model">Modelo do Gemini</label>
    <input id="model" list="modelList" spellcheck="false" autocomplete="off">
    <datalist id="modelList">
      <option value="gemini-2.0-flash"></option>
      <option value="gemini-2.0-flash-lite"></option>
      <option value="gemini-2.5-flash"></option>
      <option value="gemini-2.5-flash-lite"></option>
    </datalist>
    <p class="dica">O padrão é o gemini-2.0-flash (rápido e barato). Você pode digitar outro nome.</p>
  </section>

  <section>
    <label style="margin-top:0">Verificação de links externos</label>
    <button id="grantLinks" type="button">Permitir acesso aos sites dos links</button>
    <p class="dica">Opcional: sem essa permissão, links de outros domínios ficam como "não verificado".</p>
  </section>

  <footer>
    <a id="getKey" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Obter uma chave no Google AI Studio</a>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
